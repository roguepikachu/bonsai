# Atlas Configuration and Schema Files
apiVersion: v1
kind: ConfigMap
metadata:
  name: bonsai-atlas-config
  namespace: default
  labels:
    app: bonsai
    component: migration
data:
  atlas.hcl: |
    # Atlas production configuration
    env "local" {
      src = "file://schema"
      url = env("DATABASE_URL")
      migration {
        dir = "file://atlas-migrations"
      }
      diff {
        concurrent_index {
          create = true
          drop = true
        }
      }
    }

    env "production" {
      src = "file://schema"
      url = env("DATABASE_URL")
      migration {
        dir = "file://atlas-migrations"
      }
      diff {
        concurrent_index {
          create = true
          drop = true
        }
      }
      # Strict production lint checks
      lint {
        destructive {
          error = true
        }
        data_depend {
          error = true
        }
        naming {
          error = true
        }
      }
    }

    format {
      migrate {
        diff = "{{ sql . \"  \" }}"
      }
    }

  snippets.hcl: |
    # Bonsai snippet service schema definition
    # This file defines the desired database schema state

    table "snippets" {
      schema = schema.public

      column "id" {
        null = false
        type = text
      }

      column "content" {
        null = false
        type = text
      }

      column "tags" {
        null    = false
        type    = jsonb
        default = "'[]'::jsonb"
      }

      column "created_at" {
        null = false
        type = timestamptz
      }

      column "expires_at" {
        null = true
        type = timestamptz
      }

      primary_key {
        columns = [column.id]
      }

      index "idx_snippets_created_at" {
        columns = [column.created_at]
        type    = BTREE
        # Use DESC ordering for efficient newest-first queries
        on {
          column = column.created_at
          desc   = true
        }
      }

      index "idx_snippets_expires_at" {
        columns = [column.expires_at]
        type    = BTREE
        # For cleanup queries and expiration filtering
      }

      index "idx_snippets_tags_gin" {
        columns = [column.tags]
        type    = GIN
        # GIN index for efficient JSONB tag queries
      }
    }

    schema "public" {
      comment = "Bonsai snippet service public schema"
    }

  20250915100000_baseline.sql: |
    -- Create "snippets" table
    CREATE TABLE "public"."snippets" (
      "id" text NOT NULL,
      "content" text NOT NULL,
      "tags" jsonb NOT NULL DEFAULT '[]'::jsonb,
      "created_at" timestamptz NOT NULL,
      "expires_at" timestamptz NULL,
      PRIMARY KEY ("id")
    );

    -- Create index "idx_snippets_created_at" to table: "snippets"
    CREATE INDEX CONCURRENTLY "idx_snippets_created_at" ON "public"."snippets" ("created_at" DESC);

    -- Create index "idx_snippets_expires_at" to table: "snippets"
    CREATE INDEX CONCURRENTLY "idx_snippets_expires_at" ON "public"."snippets" ("expires_at");

    -- Create index "idx_snippets_tags_gin" to table: "snippets"
    CREATE INDEX CONCURRENTLY "idx_snippets_tags_gin" ON "public"."snippets" USING GIN ("tags");

  20250915120000_add_snippet_language.sql: |
    -- Add "language" column to table: "snippets"
    ALTER TABLE "public"."snippets" ADD COLUMN "language" text NOT NULL DEFAULT 'text';

    -- Create index "idx_snippets_language" to table: "snippets"
    CREATE INDEX CONCURRENTLY "idx_snippets_language" ON "public"."snippets" ("language");

    -- Update atlas.sum with migration hash (would be generated by Atlas)
    -- This is an example of expand-phase migration following zero-downtime principles

  atlas.sum: |
    h1:+P4S7G+3AjOzrPM2ioNSG7F+JEKl3GI7IQHQWXkdnuk=
    20250915100000_baseline.sql h1:YbCgKJzaKQlE7fBsWvx7tN0qU+2K3jG/u1Gq0Pqzd34=
    20250915120000_add_snippet_language.sql h1:XdF8HjRbNm6VzK9w2Lq3P5tE7cQ8A1nG/v2Hk4Mjz56=